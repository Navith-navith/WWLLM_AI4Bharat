<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="1000" height="1350" style="background:#ffffff; font-family:'Noto Serif Devanagari', 'Cinzel', 'Times New Roman', serif;">
  <rect width="1000" height="1350" fill="#ffffff" />
  
  <!-- Gazette Double Border -->
  <rect x="25" y="25" width="950" height="1300" fill="none" stroke="#000000" stroke-width="2.5" />
  <rect x="30" y="30" width="940" height="1290" fill="none" stroke="#000000" stroke-width="0.8" />

  <!-- Postal Registration Top Header -->
  <text x="50" y="55" font-size="11" font-family="'JetBrains Mono', monospace">रजिस्ट्री सं. डी.एल.- 33004/99</text>
  <text x="950" y="55" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">REGD. NO. D. L.-33004/99</text>
  <line x1="30" y1="65" x2="970" y2="65" stroke="#000000" stroke-width="1" />

  <!-- Ashoka Lion Emblem Crest -->
  <g transform="translate(500, 115)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#000000" stroke-width="1.5" />
    <path d="M -12 10 L 0 -15 L 12 10 Z M -6 4 L 6 4" fill="#000000" />
    <text x="0" y="38" font-size="11" font-weight="700" text-anchor="middle">सत्यमेव जयते</text>
  </g>

  <!-- Gazette Header Bilingual -->
  <text x="500" y="195" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="3">भारत का राजपत्र</text>
  <text x="500" y="225" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="5">The Gazette of India</text>
  <text x="500" y="248" font-size="14" font-weight="700" text-anchor="middle">असाधारण / EXTRAORDINARY</text>
  <text x="500" y="265" font-size="12" text-anchor="middle">भाग II—खण्ड 3—उप-खण्ड (i) / PART II—Section 3—Sub-section (i)</text>
  <text x="500" y="280" font-size="12" text-anchor="middle">प्राधिकार से प्रकाशित / PUBLISHED BY AUTHORITY</text>

  <line x1="30" y1="292" x2="970" y2="292" stroke="#000000" stroke-width="2" />
  <line x1="30" y1="296" x2="970" y2="296" stroke="#000000" stroke-width="0.8" />

  <!-- Issue Date Header Bar -->
  <g transform="translate(50, 318)">
    <text x="0" y="0" font-size="13" font-weight="700">सं. 248]</text>
    <text x="450" y="0" font-size="13" font-weight="700" text-anchor="middle">नई दिल्ली, सोमवार, मई 4, 2026/वैशाख 14, 1948</text>
    <text x="900" y="0" font-size="13" font-weight="700" text-anchor="end">[No. 248</text>

    <text x="450" y="18" font-size="12" text-anchor="middle">NEW DELHI, MONDAY, MAY 4, 2026/VAISAKHA 14, 1948</text>
  </g>

  <line x1="30" y1="345" x2="970" y2="345" stroke="#000000" stroke-width="1.5" />

  <!-- Body Content: Ministry Header -->
  <g transform="translate(50, 375)">
    <text x="450" y="20" font-size="16" font-weight="800" text-anchor="middle">शिक्षा मंत्रालय</text>
    <text x="450" y="38" font-size="14" font-weight="700" text-anchor="middle">(उच्च शिक्षा विभाग)</text>
    <text x="450" y="58" font-size="14" font-weight="700" text-anchor="middle">अधिसूचना</text>
    <text x="450" y="78" font-size="12" text-anchor="middle">नई दिल्ली, 4 मई, 2026</text>

    <text x="0" y="115" font-size="13" font-weight="700">सा.का.नि. 289(अ).—</text>
    <text x="120" y="115" font-size="13" font-weight="400">विश्वविद्यालय अनुदान आयोग अधिनियम, 1956 (1956 का 3) की धारा 12 के</text>
    <text x="0" y="138" font-size="13">अधीन प्रदत्त शक्तियों का प्रयोग करते हुए, केंद्र सरकार एतद्द्वारा भारतीय भाषाओं में उच्च तकनीकी शिक्षा</text>
    <text x="0" y="161" font-size="13">तथा व्यावसायिक डिग्रियों (इंजीनियरिंग, प्रबंधन एवं आर्किटेक्चर) के शिक्षण एवं परीक्षा प्रणाली को पूरे देश</text>
    <text x="0" y="184" font-size="13">के समस्त मान्यता प्राप्त विश्वविद्यालयों में अनिवार्य विकल्प के रूप में अधिसूचित करती है।</text>

    <text x="0" y="225" font-size="13" font-weight="700">1. संक्षिप्त नाम और प्रारम्भ:—</text>
    <text x="30" y="248" font-size="13">(1) इन विनियमों का संक्षिप्त नाम "भारतीय भाषा उच्च शिक्षा संवर्धन विनियम, 2026" है।</text>
    <text x="30" y="271" font-size="13">(2) ये राजपत्र में उनके प्रकाशन की तारीख से तुरंत प्रवृत्त होंगे।</text>

    <text x="0" y="310" font-size="13" font-weight="700">2. अनुवाद एवं पाठ्य सामग्री संवर्धन:—</text>
    <text x="30" y="333" font-size="13">समस्त उच्च शिक्षण संस्थान AI4Bharat तथा भारतजेन (BharatGen) संप्रभु एआई प्रतिमानों के सहयोग से</text>
    <text x="30" y="356" font-size="13">संविधान की आठवीं अनुसूची में सम्मिलित 22 भाषाओं में अनुवादित पाठ्यपुस्तकें एवं व्याख्यान उपलब्ध कराएंगे।</text>

    <!-- Column Line Separation for Bilingual Text -->
    <line x1="0" y1="390" x2="900" y2="390" stroke="#000000" stroke-width="0.8" />
    
    <text x="450" y="420" font-size="15" font-weight="800" text-anchor="middle">MINISTRY OF EDUCATION</text>
    <text x="450" y="438" font-size="13" font-weight="700" text-anchor="middle">(Department of Higher Education)</text>
    <text x="450" y="456" font-size="13" font-weight="700" text-anchor="middle">NOTIFICATION</text>
    <text x="450" y="474" font-size="12" text-anchor="middle">New Delhi, the 4th May, 2026</text>

    <text x="0" y="505" font-size="12.5">G.S.R. 289(E).—In exercise of the powers conferred by Section 12 of the University Grants Commission Act,</text>
    <text x="0" y="525" font-size="12.5">1956 (3 of 1956), the Central Government hereby notifies the comprehensive rollout of technical, engineering</text>
    <text x="0" y="545" font-size="12.5">and professional degree curricula in 22 Scheduled Indian languages across all accredited universities.</text>
    <text x="0" y="575" font-size="12.5">[F. No. UGC-SEC/2026/891] Dr. RAJNISH JAIN, Secy.</text>
  </g>

  <!-- Government of India Official Red Wax Seal -->
  <g transform="translate(750, 1080) rotate(-3)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#991b1b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="63" fill="none" stroke="#991b1b" stroke-width="1.2" stroke-dasharray="4,2" />
    <text x="0" y="-38" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">भारत सरकार मुद्रणालय</text>
    <text x="0" y="-18" font-size="11" font-weight="800" fill="#7f1d1d" text-anchor="middle">NEW DELHI PRESS</text>
    <text x="0" y="5" font-size="11" font-weight="900" fill="#991b1b" text-anchor="middle">GAZETTE BRANCH</text>
    <text x="0" y="24" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">RECORD VERIFIED</text>
    <text x="0" y="42" font-size="8" fill="#b91c1c" text-anchor="middle">DATE: 04-MAY-2026</text>
  </g>

  <!-- Signatory -->
  <g transform="translate(150, 1100)">
    <path d="M 20 40 Q 55 10 90 35 T 140 20 T 180 40" fill="none" stroke="#000000" stroke-width="2" />
    <line x1="10" y1="55" x2="250" y2="55" stroke="#000000" stroke-width="1" />
    <text x="130" y="75" font-size="12" font-weight="700">डॉ. रजनीश जैन, सचिव</text>
    <text x="130" y="92" font-size="11">Dr. Rajnish Jain, Secretary UGC</text>
  </g>

  <!-- Legal Print Barcode Footnote -->
  <g transform="translate(50, 1260)">
    <line x1="0" y1="0" x2="900" y2="0" stroke="#000000" stroke-width="1" />
    <text x="0" y="22" font-size="10" font-family="'JetBrains Mono', monospace">UPLOADED BY THE MANAGER, GOVT. OF INDIA PRESS, MINTO ROAD, NEW DELHI-110002</text>
    <text x="900" y="22" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="end">WWW.EGZETTE.NIC.IN</text>
  </g>
</svg>
