  <text x="70" y="1220" font-size="10.5" fill="#64748b">1. डिजी लॉकर (DigiLocker) वरून अधिकृत डिजिटल प्रत मिळवण्यासाठी संदर्भ क्रमांक HSC-PUN-2026-091823 वापरा.</text>
